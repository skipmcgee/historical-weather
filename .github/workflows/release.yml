name: Release Builds

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.0'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release
      - name: Zip web build
        run: (cd build/web && zip -r ../../historical-weather-web.zip .)
      - uses: actions/upload-artifact@v7
        with:
          name: historical-weather-web
          path: historical-weather-web.zip
      - name: Attach to GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: historical-weather-web.zip

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Zip Linux build
        run: (cd build/linux/x64/release/bundle && zip -r ../../../../../historical-weather-linux.zip .)
      - uses: actions/upload-artifact@v7
        with:
          name: historical-weather-linux
          path: historical-weather-linux.zip
      - name: Attach to GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: historical-weather-linux.zip

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip macOS app
        run: (cd build/macos/Build/Products/Release && zip -r "$GITHUB_WORKSPACE/historical-weather-macos.zip" *.app)
      - uses: actions/upload-artifact@v7
        with:
          name: historical-weather-macos
          path: historical-weather-macos.zip
      - name: Attach to GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: historical-weather-macos.zip

  build-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # No Apple signing certificate/provisioning profile is configured in this repo, so this
      # produces an unsigned .app rather than an installable/distributable .ipa. Once signing
      # secrets (certificate, provisioning profile, team ID) are added, switch this to
      # `flutter build ipa --export-options-plist=<path>` to produce a real release artifact.
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/*.app Payload/
          zip -r historical-weather-ios-unsigned.zip Payload
      - uses: actions/upload-artifact@v7
        with:
          name: historical-weather-ios-unsigned
          path: historical-weather-ios-unsigned.zip
      - name: Attach to GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: historical-weather-ios-unsigned.zip

  dependabot-merge:
    # Auto-approve and merge Dependabot PRs once every build job above has
    # passed -- patch/minor updates only; major version bumps still land as
    # regular PRs for manual review. This repo's private-plan tier doesn't
    # expose GitHub's native "Allow auto-merge" toggle (same restriction as
    # branch protection), so this merges directly instead of deferring to
    # that feature. Dependabot pushes branches into this repo directly
    # (it's not a fork), so the default GITHUB_TOKEN already has the write
    # access this needs without requiring `pull_request_target`.
    needs: [test, build-web, build-linux, build-macos, build-ios]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Approve and merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
