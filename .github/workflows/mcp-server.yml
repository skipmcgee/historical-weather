name: MCP Server

on:
  push:
    branches: [main]
    paths: ['mcp-server/**', '.github/workflows/mcp-server.yml']
  pull_request:
    branches: [main]
    paths: ['mcp-server/**', '.github/workflows/mcp-server.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: mcp-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
